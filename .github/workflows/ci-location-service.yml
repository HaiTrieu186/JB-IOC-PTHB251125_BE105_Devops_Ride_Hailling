name: CI location-service

on:
  push:
    paths:
      - 'services/location-service/**'
      - '.github/workflows/ci-location-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/location-service/go.mod

      - name: Run vet and build
        working-directory: services/location-service
        run: go vet ./... && go build ./...

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER_LC }}/location-service:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER_LC }}/location-service:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            services/location-service
          docker push ghcr.io/${{ env.OWNER_LC }}/location-service:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LC }}/location-service:latest

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml and infra/ to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          target: ${{ secrets.VPS_APP_DIR }}
          source: "docker-compose.yml,infra/"

      - name: Deploy location-service on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR
          script_stop: true
          script: |
            cd $VPS_APP_DIR && docker compose pull location-service && docker compose up -d --no-deps location-service && docker image prune -f

