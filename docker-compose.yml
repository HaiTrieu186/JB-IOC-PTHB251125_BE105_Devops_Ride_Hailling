services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: 200m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    mem_limit: 60m
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?}
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./services/user-service
    image: ghcr.io/${GHCR_OWNER:?}/user-service:latest
    container_name: user-service
    restart: unless-stopped
    mem_limit: 30m
    environment:
      PORT: "8001"
      DATABASE_URL: "postgres://user_user:user_pass@postgres:5432/userdb?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ACCESS_TOKEN_EXPIRY: "3600"
      REFRESH_TOKEN_EXPIRY: "604800"
      ADMIN_EMAIL: "admin@ridehailing.local"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      GOMEMLIMIT: "26MiB"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  location-service:
    build: ./services/location-service
    image: ghcr.io/${GHCR_OWNER:?}/location-service:latest
    container_name: location-service
    restart: unless-stopped
    mem_limit: 25m
    environment:
      PORT: "8002"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      DEFAULT_RADIUS_KM: ${DEFAULT_RADIUS_KM:-5.0}
      MAX_RADIUS_KM: ${MAX_RADIUS_KM:-10.0}
      GPS_FRESHNESS_SECONDS: ${GPS_FRESHNESS_SECONDS:-15}
      GEO_SCAN_COUNT: ${GEO_SCAN_COUNT:-500}
      GOMEMLIMIT: "22MiB"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8002/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  pricing-service:
    build: ./services/pricing-service
    image: ghcr.io/${GHCR_OWNER:?}/pricing-service:latest
    container_name: pricing-service
    restart: unless-stopped
    mem_limit: 30m
    environment:
      PORT: "8004"
      DATABASE_URL: "postgres://pricing_user:pricing_pass@postgres:5432/pricingdb?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      DEFAULT_BASE_FARE: ${DEFAULT_BASE_FARE:-10000}
      DEFAULT_PRICE_PER_KM: ${DEFAULT_PRICE_PER_KM:-12000}
      SURGE_THRESHOLD: ${SURGE_THRESHOLD:-1.0}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-400}
      LOCATION_SERVICE_URL: "http://location-service:8002"
      USER_SERVICE_URL: "http://user-service:8001"
      INTERNAL_HTTP_TIMEOUT_MS: "500"
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      PEL_BATCH_COUNT: ${PEL_BATCH_COUNT:-10}
      GOMEMLIMIT: "26MiB"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8004/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build: ./services/payment-service
    image: ghcr.io/${GHCR_OWNER:?}/payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    mem_limit: 30m
    environment:
      PORT: "8005"
      DATABASE_URL: "postgres://payment_user:payment_pass@postgres:5432/paymentdb?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      COMMISSION_RATE: ${COMMISSION_RATE:-15}
      TOPUP_MAX_AMOUNT: ${TOPUP_MAX_AMOUNT:-100000000}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      PEL_BATCH_COUNT: ${PEL_BATCH_COUNT:-10}
      GOMEMLIMIT: "26MiB"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8005/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  dispatch-service:
    build: ./services/dispatch-service
    image: ghcr.io/${GHCR_OWNER:?}/dispatch-service:latest
    container_name: dispatch-service
    restart: unless-stopped
    mem_limit: 30m
    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://dispatch_user:dispatch_pass@postgres:5432/dispatchdb?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      COMMISSION_RATE: ${COMMISSION_RATE:-15}
      OFFER_RADIUS_KM: ${OFFER_RADIUS_KM:-5}
      MATCHING_TIMEOUT_SECONDS: ${MATCHING_TIMEOUT_SECONDS:-30}
      INTERNAL_HTTP_TIMEOUT_MS: ${INTERNAL_HTTP_TIMEOUT_MS:-2000}
      PRICING_SERVICE_URL: "http://pricing-service:8004"
      PAYMENT_SERVICE_URL: "http://payment-service:8005"
      LOCATION_SERVICE_URL: "http://location-service:8002"
      USER_SERVICE_URL: "http://user-service:8001"
      GOMEMLIMIT: "26MiB"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8003/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./services/api-gateway
    image: ghcr.io/${GHCR_OWNER:?}/api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    mem_limit: 25m
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?}
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      USER_SERVICE_URL: "http://user-service:8001"
      LOCATION_SERVICE_URL: "http://location-service:8002"
      DISPATCH_SERVICE_URL: "http://dispatch-service:8003"
      PRICING_SERVICE_URL: "http://pricing-service:8004"
      PAYMENT_SERVICE_URL: "http://payment-service:8005"
      AI_SERVICE_URL: "http://ai-service:8006"
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-15000}
      GOMEMLIMIT: "22MiB"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  ws-gateway:
    build: ./services/ws-gateway
    image: ghcr.io/${GHCR_OWNER:?}/ws-gateway:latest
    container_name: ws-gateway
    restart: unless-stopped
    mem_limit: 30m
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: "8081"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      LOCATION_SERVICE_URL: "http://location-service:8002"
      LOCATION_TIMEOUT_MS: ${LOCATION_TIMEOUT_MS:-300}
      PING_INTERVAL_SECONDS: ${PING_INTERVAL_SECONDS:-30}
      PONG_WAIT_SECONDS: ${PONG_WAIT_SECONDS:-60}
      CLIENT_BUFFER_SIZE: ${CLIENT_BUFFER_SIZE:-64}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-300}
      GOMEMLIMIT: "26MiB"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: backend-net


